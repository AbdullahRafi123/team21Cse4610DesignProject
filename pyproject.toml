[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lightdp-flower"
version = "1.0.0"
description = "Flower CIFAR-10 federated learning applications and privacy research extensions"
readme = "README.md"
license = "MIT"
authors = [{ name = "CSE4610 Team 21" }]
requires-python = ">=3.10,<3.14"
keywords = ["federated-learning", "differential-privacy", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "flwr[simulation]>=1.20.0,<1.26.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "scikit-image>=0.22",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/AbdullahRafi123/team21Cse4610DesignProject"
Documentation = "https://github.com/AbdullahRafi123/team21Cse4610DesignProject/blob/main/docs/RESEARCH_STANDARDS.md"

[tool.hatch.build.targets.wheel]
packages = ["src/lightdp_fl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.flwr.app]
publisher = "team21"

[tool.flwr.app.components]
serverapp = "lightdp_fl.server_app:app"
clientapp = "lightdp_fl.client_app:app"

# Safe two-round smoke run using standard FedAvg. Use configs/full_lightdp.toml
# to exercise the LightDP research variant on locally trained FedAvg updates.
[tool.flwr.app.config]
seed = 2026
num-clients = 5
num-server-rounds = 2
max-colluders = 1
max-stragglers = 1
epsilon = 0.0
delta = 0.00001
clip = 1.0
image-size = 224
feature-batch = 128
method = "no_dp"
training-algorithm = "fedavg"
client-update-clip = 1.0
partition-method = "iid"
dirichlet-alpha = 0.5
client-data-mode = "partitioned_cifar10"
simulate-stragglers = true
validation-fraction = 0.1
local-epochs = 1
batch-size = 32
local-learning-rate = 0.01
local-momentum = 0.9
fraction-fit = 1.0
max-records-per-client = 64
use-pretrained = true
cache-dir = ".cache/lightdp_flower"
output-dir = "results/experiments"
tag = "auto"
git-track-results = true
device = "auto"
resume = false

[tool.flwr.federations]
default = "local-simulation"

# Same-host deployment-engine check. For machines on a network, change the
# address and use the TLS profile below instead of this insecure profile.
[tool.flwr.federations.network-demo]
address = "127.0.0.1:9093"
insecure = true

# Multi-machine profile: place the CA certificate at this path and replace
# the address with the SuperLink host. Never use insecure=true on an open network.
[tool.flwr.federations.network-tls]
address = "127.0.0.1:9093"
root-certificates = "./certificates/ca.crt"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 5
options.backend.client-resources.num-cpus = 1
# CPU-only default: fractional GPU reservations make Ray reject the pool when
# running on a machine without a CUDA GPU.
options.backend.client-resources.num-gpus = 0

# Five-client CUDA smoke profile. One full GPU reservation lets one client
# train at a time, avoiding overlapping CUDA workers during device validation.
[tool.flwr.federations.local-simulation-gpu-smoke]
options.num-supernodes = 5
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 1.0

# Main experiment suite: 50 CPU clients while preserving the five-client
# lightweight default above for direct Flower smoke runs.
[tool.flwr.federations.local-simulation-suite]
options.num-supernodes = 50
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0

[tool.flwr.federations.local-simulation-suite-25]
options.num-supernodes = 25
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0

[tool.flwr.federations.local-simulation-suite-100]
options.num-supernodes = 100
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0

# CUDA profile for the 50-client main experiment suite.
[tool.flwr.federations.local-simulation-gpu]
options.num-supernodes = 50
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 1.0

# Opt-in throughput pilots for one GPU. Flower allocations schedule workers;
# they are not VRAM isolation or guarantees of safe concurrent execution.
[tool.flwr.federations.local-simulation-gpu-half]
options.num-supernodes = 50
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0.5

[tool.flwr.federations.local-simulation-gpu-quarter]
options.num-supernodes = 50
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0.25

[tool.flwr.federations.local-simulation-gpu-25]
options.num-supernodes = 25
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 1.0

[tool.flwr.federations.local-simulation-gpu-100]
options.num-supernodes = 100
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 1.0
