[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lightdp-flower"
version = "1.0.0"
description = "Flower implementation of the LightDP-FL CIFAR-10 comparison notebook"
readme = "README.md"
license = "MIT"
authors = [{ name = "CSE4610 Team 21" }]
requires-python = ">=3.10,<3.14"
keywords = ["federated-learning", "differential-privacy", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "flwr[simulation]>=1.20.0,<1.26.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "scikit-image>=0.22",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/AbdullahRafi123/team21Cse4610DesignProject"
Documentation = "https://github.com/AbdullahRafi123/team21Cse4610DesignProject/blob/main/docs/RESEARCH_STANDARDS.md"

[tool.hatch.build.targets.wheel]
packages = ["src/lightdp_fl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.flwr.app]
publisher = "team21"

[tool.flwr.app.components]
serverapp = "lightdp_fl.server_app:app"
clientapp = "lightdp_fl.client_app:app"

# Safe smoke-test defaults. The source notebook's measured run used 50 clients,
# 8 main rounds and 3 sweep rounds. Use configs/full_lightdp.toml or the suite scripts.
[tool.flwr.app.config]
seed = 2026
num-clients = 5
num-server-rounds = 2
max-colluders = 1
max-stragglers = 1
epsilon = 6.0
delta = 0.00001
clip = 1.0
learning-rate = 1.0
momentum = 0.9
image-size = 224
feature-batch = 128
microbatch = 16
method = "lightdp"
non-iid = false
max-records-per-client = 64
use-pretrained = true
cache-dir = ".cache/lightdp_flower"
output-dir = "results/experiments"
tag = "smoke_lightdp"
device = "auto"
resume = false

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 5
options.backend.client-resources.num-cpus = 1
# CPU-only default: fractional GPU reservations make Ray reject the pool when
# running on a machine without a CUDA GPU.
options.backend.client-resources.num-gpus = 0

# Opt in on CUDA-capable machines with:
# flwr run . local-simulation-gpu --federation-config "options.num-supernodes=50"
[tool.flwr.federations.local-simulation-gpu]
options.num-supernodes = 5
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0.5
